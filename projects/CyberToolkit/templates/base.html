<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CyberToolkit{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-dot"></span>
        CyberToolkit
      </div>

      <nav class="nav">
        <a href="{{ url_for('home') }}" class="nav__item {% if active == 'home' %}nav__item--active{% endif %}">
          <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1V9.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Home
        </a>

        <div class="nav__group-label">Tools</div>

        <a href="{{ url_for('port_scanner') }}" class="nav__item {% if active == 'port-scanner' %}nav__item--active{% endif %}">
          <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="m17 17-3.8-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Port Scanner
        </a>

        <a href="{{ url_for('dns_lookup') }}" class="nav__item {% if active == 'dns-lookup' %}nav__item--active{% endif %}">
          <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M3 10h14M10 3c2.2 2 2.2 12 0 14M10 3c-2.2 2-2.2 12 0 14" stroke="currentColor" stroke-width="1.4"/></svg>
          DNS Lookup
        </a>

        <a href="{{ url_for('hash_cracker') }}" class="nav__item {% if active == 'hash-cracker' %}nav__item--active{% endif %}">
          <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><path d="M4 3v14M16 3v14M4 7h12M4 13h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Hash Cracker
        </a>

        <a href="{{ url_for('whois') }}" class="nav__item {% if active == 'whois' %}nav__item--active{% endif %}">
          <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14M7 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          WHOIS
        </a>
      </nav>

      <a href="{{ url_for('settings') }}" class="nav__item nav__item--settings {% if active == 'settings' %}nav__item--active{% endif %}">
        <svg class="nav__icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4M15.1 15.1l-1.4-1.4M6.3 6.3 4.9 4.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Settings
      </a>
    </aside>

    <main class="main">
      <div class="shell">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  <script src="{{ url_for('static', filename='js/components.js') }}"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
